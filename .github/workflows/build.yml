name: build

on:
  push:
    branches: [new-v2.1, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ Linux: apt Qt 6, Ninja, ctest
  linux:
    name: Linux · Qt 6 · ctest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build qt6-base-dev qt6-svg-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      # a failing test shows up in the PR page, not only in the (large) job log
      - name: Annotate failing tests
        if: failure()
        run: |
          log=build/Testing/Temporary/LastTest.log
          [ -f "$log" ] || exit 0
          grep -aE "FAIL!|QFATAL|Segmentation|Aborted|Failed +\*?[a-zA-Z]" "$log" | head -20 | while read -r line; do
            echo "::error title=failing test::${line}"
          done

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: build/Testing/**/LastTest.log
          if-no-files-found: ignore

  # ------------------------------------------------------------------ Windows: MSVC + aqt Qt 6
  windows:
    name: Windows · MSVC · ctest
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          modules: 'qtsvg'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure

  # ------------------------------------------------------------------ the business layer alone, no Qt needed
  core-only:
    name: Core · g++ · no Qt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the core tests
        run: |
          g++ -std=c++20 -Isrc/core tests/test_core.cpp src/core/*.cpp -o test_core
          ./test_core
